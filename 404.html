<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CrytoPnL — 페이지 이동 중</title>
  <script>
    (function() {
      var path = window.location.pathname;
      // If requesting a post URL: /posts/:id or /posts/:id.html
      var match = path.match(/\/posts\/([^/.]+)(?:\.html)?/);
      if (match && match[1]) {
        window.location.replace('/#/forum/post/' + match[1]);
        return;
      }
      // If requesting calculator or guide that doesn't exist
      if (path.indexOf('/calculators/') !== -1) {
        window.location.replace('/#/calculators');
        return;
      }
      if (path.indexOf('/guides/') !== -1) {
        window.location.replace('/#/guides');
        return;
      }
      // General fallback
      window.location.replace('/' + (window.location.hash || ''));
    })();
  </script>
  <style>
    body {
      margin: 0;
      background-color: #050811;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
    }
    .loader {
      display: inline-block;
      width: 32px;
      height: 32px;
      border: 3px solid rgba(56, 189, 248, 0.2);
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    h2 { font-size: 1.1rem; font-weight: 700; margin: 0 0 8px 0; color: #f8fafc; }
    p { font-size: 0.85rem; color: #94a3b8; margin: 0; }
  </style>
</head>
<body>
  <div>
    <div class="loader"></div>
    <h2>CrytoPnL 게시글로 이동 중입니다...</h2>
    <p>잠시만 기다려주시면 해당 화면으로 자동 연결됩니다.</p>
  </div>
</body>
</html>
