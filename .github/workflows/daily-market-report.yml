name: Generate Daily Crypto Market Report

on:
  schedule:
    - cron: '50 19 * * *' # 04:50 KST (19:50 UTC) - Morning market report
    - cron: '10 0 * * *'  # 09:10 KST (00:10 UTC) - Morning perspective report (09:10 KST)
    - cron: '25 0 * * *'  # 09:25 KST (00:25 UTC) - Morning backup retry (15m later)
    - cron: '10 8 * * *'  # 17:10 KST (08:10 UTC) - Afternoon perspective report (17:10 KST)
    - cron: '25 8 * * *'  # 17:25 KST (08:25 UTC) - Afternoon backup retry (15m later)
    - cron: '10 12 * * *' # 21:10 KST (12:10 UTC) - Night perspective report (21:10 KST)
    - cron: '25 12 * * *' # 21:25 KST (12:25 UTC) - Night backup retry (15m later)
  workflow_dispatch: # Allows manual trigger anytime from GitHub Actions tab

permissions:
  contents: write

jobs:
  daily-market-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate daily 08:00 KST market report
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/generate-daily-market-report.js

      - name: Commit and push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/daily-market-reports.json
          if git diff --staged --quiet; then
            echo "No market report changes to commit."
          else
            git commit -m "chore(report): auto-publish daily 08:00 KST crypto market report [skip ci]"
            git push origin main
          fi
