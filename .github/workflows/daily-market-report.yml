name: Generate Daily Crypto Market Report

on:
  schedule:
    - cron: '18 23 * * *' # 매일 08:18 KST (23:18 UTC, off-peak minute)
    - cron: '18 8 * * *'  # 매일 17:18 KST (08:18 UTC, off-peak minute)
    - cron: '18 12 * * *' # 매일 21:18 KST (12:18 UTC, off-peak minute)
  workflow_dispatch: # Allows manual trigger anytime from UI or GitHub Actions tab
    inputs:
      report_type:
        description: '생성할 리포트 유형 (all: 둘 다, perspective: 차트관점만, market: 시장분위기만)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - perspective
          - market

permissions:
  contents: write

jobs:
  daily-market-report:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate crypto market and perspective report
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          REPORT_TYPE: ${{ github.event.inputs.report_type || 'all' }}
        run: node scripts/generate-daily-market-report.js

      - name: Build static SEO pages and update sitemap
        run: node scripts/build-static-pages.js

      - name: Commit and push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/daily-market-reports.json posts/ calculators/ guides/ sitemap.xml
          if git diff --staged --quiet; then
            echo "No market report changes to commit."
          else
            git commit -m "chore(report): auto-publish daily crypto market report & static pages [skip ci]"
            git push origin main
          fi
