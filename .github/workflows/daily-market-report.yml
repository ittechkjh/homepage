name: Generate Daily Crypto Market Report

on:
  workflow_dispatch: # 수동 생성 버튼(UI 및 GitHub Actions)으로만 실행되도록 스케줄 트리거 해제
    inputs:
      report_type:
        description: '생성할 리포트 유형 (all: 둘 다, perspective: 차트관점만, market: 시장분위기만, finance: 재테크 팁 유튜브 분석, forecast: 코인 전망 유튜브 분석)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - perspective
          - market
          - finance
          - forecast
      youtube_url:
        description: '재테크 팁 또는 코인 전망 생성용 유튜브 영상 URL (선택 사항)'
        required: false
        default: ''
        type: string
      publish_at:
        description: '공개 예약 일시 (선택 사항, ISO 8601 또는 YYYY-MM-DD HH:mm:ss KST, 빈칸이면 즉시 발행)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

concurrency:
  group: repo-write-main
  cancel-in-progress: false

jobs:
  daily-market-report:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate crypto market and perspective report
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          REPORT_TYPE: ${{ github.event.inputs.report_type || 'all' }}
          YOUTUBE_URL: ${{ github.event.inputs.youtube_url || '' }}
          PUBLISH_AT: ${{ github.event.inputs.publish_at || '' }}
        run: node scripts/generate-daily-market-report.js

      - name: Sync latest repository state before static build
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin main || true

      - name: Build static SEO pages and update sitemap
        run: node scripts/build-static-pages.js

      - name: Commit and push if changed
        run: |
          git add -A
          if git diff --staged --quiet; then
            echo "No market report changes to commit."
          else
            git commit -m "chore(report): auto-publish daily crypto market report & static pages"
            if ! git push origin main; then
              git pull --rebase --autostash -X ours origin main || git rebase --abort || true
              git pull --no-rebase -X ours origin main || true
              node scripts/build-static-pages.js
              git add -A
              git diff --staged --quiet || git commit -m "chore(report): sync static pages after merge"
              git push origin main
            fi
          fi
