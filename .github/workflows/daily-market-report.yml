name: Generate Daily Crypto Market Report

on:
  schedule:
    - cron: '50 19 * * *' # 04:50 KST (19:50 UTC) - Morning report & 09:00 perspective pre-generation
    - cron: '55 23 * * *' # 08:55 KST (23:55 UTC) - Morning session perspective update (ready for 09:00 KST)
    - cron: '55 7 * * *'  # 16:55 KST (07:55 UTC) - Afternoon session perspective update (ready for 17:00 KST)
    - cron: '15 8 * * *'  # 17:15 KST (08:15 UTC) - Afternoon backup retry (prevents GitHub delay drops)
    - cron: '55 11 * * *' # 20:55 KST (11:55 UTC) - Night session perspective update (ready for 21:00 KST)
    - cron: '15 12 * * *' # 21:15 KST (12:15 UTC) - Night backup retry (prevents GitHub delay drops)
  workflow_dispatch: # Allows manual trigger anytime from GitHub Actions tab

permissions:
  contents: write

jobs:
  daily-market-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate daily 08:00 KST market report
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/generate-daily-market-report.js

      - name: Commit and push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/daily-market-reports.json
          if git diff --staged --quiet; then
            echo "No market report changes to commit."
          else
            git commit -m "chore(report): auto-publish daily 08:00 KST crypto market report [skip ci]"
            git push origin main
          fi
