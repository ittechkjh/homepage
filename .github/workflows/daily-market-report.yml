name: Generate Daily Crypto Market Report

on:
  schedule:
    - cron: '0 20 * * *' # 05:00 KST (20:00 UTC) - Morning report & 09:00 perspective pre-generation
    - cron: '0 0 * * *'  # 09:00 KST (00:00 UTC) - Morning session perspective update
    - cron: '0 8 * * *'  # 17:00 KST (08:00 UTC) - Afternoon session perspective update (17:00)
    - cron: '0 12 * * *' # 21:00 KST (12:00 UTC) - Night session perspective update (21:00)
  workflow_dispatch: # Allows manual trigger anytime from GitHub Actions tab

permissions:
  contents: write

jobs:
  daily-market-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate daily 08:00 KST market report
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/generate-daily-market-report.js

      - name: Commit and push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/daily-market-reports.json
          if git diff --staged --quiet; then
            echo "No market report changes to commit."
          else
            git commit -m "chore(report): auto-publish daily 08:00 KST crypto market report [skip ci]"
            git push origin main
          fi
