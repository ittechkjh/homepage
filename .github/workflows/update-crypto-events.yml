name: Update Crypto Events Data

on:
  schedule:
    - cron: '0 19 * * *' # Every day at 04:00 KST (19:00 UTC)
  workflow_dispatch: # Allows manual trigger anytime from GitHub Actions tab

permissions:
  contents: write

jobs:
  update-crypto-events:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch and refine crypto & macro events
        run: node scripts/update-crypto-events.js

      - name: Commit and push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/crypto-events.json
          if git diff --staged --quiet; then
            echo "No crypto event changes to commit."
          else
            git commit -m "chore(crypto): auto-update crypto and macro events calendar [skip ci]"
            git push origin main
          fi
