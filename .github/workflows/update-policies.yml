name: Update Government Policy Data

on:
  schedule:
    - cron: '0 19 * * *' # Every day at 04:00 KST (19:00 UTC)
  workflow_dispatch: # Allows manual trigger anytime from GitHub Actions tab

permissions:
  contents: write

jobs:
  update-policies:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch and refine government policies
        env:
          DATA_GO_KR_API_KEY: ${{ secrets.DATA_GO_KR_API_KEY || 'G7N6elMlYOmqsOnctk%2B0X1Dpyz1ajBFF82gcH8Sl%2FgRDD5Jb4gangmAU2KZgmWSerzjtZqEQLlAxay4dFH3IPw%3D%3D' }}
          MAX_PAGES: '25'
        run: node scripts/update-policy-data.js

      - name: Commit and push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/policy-data.json
          if git diff --staged --quiet; then
            echo "No policy changes to commit."
          else
            git commit -m "chore(policy): auto-update government welfare and benefits data [skip ci]"
            git push origin main
          fi
