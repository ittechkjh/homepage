name: Update Macro Indicators Data

on:
  schedule:
    - cron: '0 22 * * *' # Every day at 07:00 KST (22:00 UTC, right after US markets close)
  workflow_dispatch: # Allows manual trigger anytime from GitHub Actions tab

permissions:
  contents: write

jobs:
  update-macro:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch and refine TradFi & Macro indicators
        run: node scripts/update-macro-indicators.js

      - name: Commit and push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/macro-indicators.json
          if git diff --staged --quiet; then
            echo "No macro indicator changes to commit."
          else
            git commit -m "chore(macro): auto-update TradFi and macroeconomic indicators [skip ci]"
            git push origin main
          fi
