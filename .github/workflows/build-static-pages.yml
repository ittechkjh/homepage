name: Auto Build Static Pages on New Forum Post

on:
  repository_dispatch:
    types: [forum_post_created]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-static-pages:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build static SEO pages from Firestore & reports
        run: node scripts/build-static-pages.js

      - name: Commit and push static documents
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add posts/ calculators/ guides/ sitemap.xml
          if git diff --staged --quiet; then
            echo "No new static pages to commit."
          else
            git commit -m "chore(seo): auto-generate static post web document & update sitemap [skip ci]"
            git push origin main
          fi
